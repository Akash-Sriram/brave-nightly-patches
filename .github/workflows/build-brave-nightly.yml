name: Build and Release Patched Brave Nightly

on:
  workflow_dispatch:
    inputs:
      brave_tag:
        description: 'Brave Release Tag (leave empty for latest Nightly)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if release already exists'
        required: false
        type: boolean
        default: false
  schedule:
    # Runs every 6 hours to automatically catch new Brave Nightly releases
    - cron: '0 */6 * * *'

jobs:
  check-and-build:
    name: Build & Release Brave Nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fetch Latest Brave Nightly Tag
        id: brave_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ github.event.inputs.brave_tag }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
          else
            # Fetch the single newest release tag
            TAG=$(gh api "repos/brave/brave-browser/releases" --jq ".[0].tag_name" | head -n 1 | tr -d '\r\n')
          fi

          RELEASE_TAG="brave-nightly-$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          # Check if this release already exists in our repository
          EXISTS=$(gh release view "$RELEASE_TAG" --repo ${{ github.repository }} --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$EXISTS" ] && [ "$FORCE" != "true" ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Release $RELEASE_TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "Target Brave Tag: $TAG"

      - name: Download Latest BraveMonoarm64.apk
        if: steps.brave_info.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.brave_info.outputs.tag }}
        run: |
          echo "Downloading official BraveMonoarm64.apk for tag $TAG..."
          gh release download "$TAG" --repo brave/brave-browser --pattern "BraveMonoarm64.apk" --output "BraveMonoarm64.apk"
          ls -lh BraveMonoarm64.apk

      - name: Download Morphe Desktop CLI
        if: steps.brave_info.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo MorpheApp/morphe-desktop --pattern "*all.jar" --output "morphe-desktop.jar"

      - name: Prepare Patch Bundle
        if: steps.brave_info.outputs.should_build == 'true'
        run: |
          if [ -f "patches/patches.mpp" ]; then
            cp patches/patches.mpp patches.mpp
          else
            chmod +x ./gradlew
            ./gradlew :patches:buildAndroid --no-daemon
            cp patches/build/libs/patches-*.mpp patches.mpp
          fi

      - name: Patch Brave Nightly APK
        if: steps.brave_info.outputs.should_build == 'true'
        run: |
          java -jar morphe-desktop.jar patch \
            -p="patches.mpp" \
            -e="Brave Origin" \
            -f \
            -o="BraveNightly-arm64-patched.apk" \
            "BraveMonoarm64.apk"

      - name: Package All-in-One Magisk / KernelSU Root Module
        if: steps.brave_info.outputs.should_build == 'true'
        env:
          TAG: ${{ steps.brave_info.outputs.tag }}
        run: |
          mkdir -p magisk-module/META-INF/com/google/android
          cd magisk-module

          # 1. Copy full patched monolithic base.apk
          cp ../BraveNightly-arm64-patched.apk base.apk

          # 2. Create module.prop
          cat <<EOF > module.prop
          id=brave-nightly-origin
          name=Brave Nightly Origin (All-in-One Root)
          version=$TAG
          versionCode=$(date +%Y%m%d)
          author=Akash
          description=All-in-One Magisk/KernelSU Module: Automatically installs & mounts patched Brave Nightly with Brave Origin unlocked.
          EOF

          # 3. Create customize.sh (Auto-installs APK directly during flashing)
          cat <<'EOF' > customize.sh
          ui_print "************************************************"
          ui_print "*   Brave Nightly Origin All-in-One Installer  *"
          ui_print "************************************************"
          ui_print "- Installing / Updating Brave Nightly Monolithic..."

          # Attempt package manager install directly during module flash
          if pm install -r -d -g "$MODPATH/base.apk" >/dev/null 2>&1; then
              ui_print "✔ App installed into system package registry successfully."
          else
              ui_print "! PM install returned non-zero, fallback to runtime boot mount."
          fi

          ui_print "- Setting permissions..."
          set_perm_recursive "$MODPATH" 0 0 0755 0644
          set_perm "$MODPATH/service.sh" 0 0 0755
          ui_print "✔ Installation complete! Reboot to activate mount."
          EOF

          # 4. Create service.sh (Persistent runtime mount on boot)
          cat <<'EOF' > service.sh
          #!/system/bin/sh
          MODDIR=${0%/*}
          PKG="com.brave.browser_nightly"

          # Wait until boot completes and Package Manager is ready
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
              sleep 1
          done

          # Locate base.apk path dynamically
          APK_PATH=$(pm path $PKG 2>/dev/null | grep base.apk | head -n 1 | cut -d: -f2)
          if [ -n "$APK_PATH" ] && [ -f "$MODDIR/base.apk" ]; then
              mount -o bind "$MODDIR/base.apk" "$APK_PATH"
              chcon u:object_r:apk_data_file:s0 "$APK_PATH"
          fi
          EOF
          chmod 755 service.sh

          # 5. Create updater scripts for flashing
          cat <<'EOF' > META-INF/com/google/android/updater-script
          #MAGISK
          EOF
          cat <<'EOF' > META-INF/com/google/android/update-binary
          #!/sbin/sh
          #################
          # Magisk Bootstrapper
          #################
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          exec $(magisk --path)/magiskboot --unpack-zip "$ZIPFILE" customize.sh "$OUTFD"
          EOF

          # 6. Create ZIP archive
          zip -r9 ../BraveNightly-Root-Magisk-Module.zip ./*
          cd ..

      - name: Generate Checksums
        if: steps.brave_info.outputs.should_build == 'true'
        run: |
          sha256sum BraveNightly-arm64-patched.apk > BraveNightly-arm64-patched.apk.sha256
          sha256sum BraveNightly-Root-Magisk-Module.zip > BraveNightly-Root-Magisk-Module.zip.sha256

      - name: Publish GitHub Release
        if: steps.brave_info.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.brave_info.outputs.release_tag }}
          name: "Brave Nightly Patched (${{ steps.brave_info.outputs.tag }})"
          body: |
            ### 🚀 Releases for Brave Nightly ${{ steps.brave_info.outputs.tag }}
            
            #### 1. Root Users (Magisk / KernelSU / APatch) — Recommended
            * **`BraveNightly-Root-Magisk-Module.zip`**: 
              * **All-in-One**: Flash directly in **Magisk / KernelSU / APatch Manager**.
              * The installer automatically registers and bind-mounts the app with Brave's official signature.
            
            #### 2. Non-Root Users
            * **`BraveNightly-arm64-patched.apk`**: Sideload and install as a standalone APK.
          draft: false
          prerelease: false
          files: |
            BraveNightly-arm64-patched.apk
            BraveNightly-arm64-patched.apk.sha256
            BraveNightly-Root-Magisk-Module.zip
            BraveNightly-Root-Magisk-Module.zip.sha256
